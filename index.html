<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>صحبي — شبكة اجتماعية</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <main id="authView" class="auth-shell">
    <section class="brand-card">
      <div class="logo">ص</div>
      <h1>صحبي</h1>
      <p>مكانك مع صحابك، من غير تعقيد.</p>
    </section>

    <section class="auth-card">
      <div class="tabs">
        <button class="tab active" data-mode="login">تسجيل الدخول</button>
        <button class="tab" data-mode="register">إنشاء حساب</button>
      </div>

      <form id="authForm">
        <div id="nameField" class="field hidden">
          <label>الاسم</label>
          <input id="displayName" maxlength="80" autocomplete="name">
        </div>

        <div id="usernameField" class="field hidden">
          <label>اسم المستخدم</label>
          <input id="username" maxlength="30" autocomplete="username" placeholder="مثال: sohby123">
        </div>

        <div class="field">
          <label>البريد الإلكتروني</label>
          <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
        </div>

        <div class="field">
          <label>كلمة المرور</label>
          <input id="password" type="password" required minlength="8" autocomplete="current-password" placeholder="8 أحرف على الأقل">
        </div>

        <button id="authSubmit" class="primary" type="submit">دخول</button>
        <p id="authError" class="error"></p>
      </form>
    </section>
  </main>

  <main id="appView" class="app-shell hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="mini-brand"><span class="mini-logo">ص</span><b>صحبي</b></div>
        <div class="top-actions">
          <button id="refreshBtn" class="icon-btn" title="تحديث">↻</button>
          <button id="logoutBtn" class="ghost">خروج</button>
        </div>
      </div>
    </header>

    <div class="layout">
      <aside class="profile-card card">
        <div class="avatar" id="profileAvatar">ص</div>
        <h2 id="profileName">—</h2>
        <p id="profileUsername">—</p>
        <p id="profileBio">أهلاً بيك في صحبي 👋</p>
      </aside>

      <section class="feed">
        <div class="composer card">
          <div class="composer-head">
            <div class="avatar small" id="composerAvatar">ص</div>
            <b>اكتب حاجة يا صاحبي...</b>
          </div>
          <textarea id="postContent" maxlength="1000" placeholder="شارك أصحابك حاجة جديدة"></textarea>
          <div class="composer-bottom">
            <span id="counter">0 / 1000</span>
            <button id="postBtn" class="primary">نشر</button>
          </div>
          <p id="postError" class="error"></p>
        </div>

        <div id="posts" class="posts"></div>
        <div id="empty" class="empty card hidden">مفيش منشورات لسه. كن أول واحد ينشر 👋</div>
      </section>
    </div>
  </main>

<script src="/app.js"></script>
</body>
</html>
