rm:translateX(-50%);background:#102b55;color:#ff
f;padding:10px 15px;border-radius:12px;z-index:100;display:none;font-size:12px}.profileHero{padding:20px 15px;background:linear-gradient(135deg,#eaf3ff,#fff)}.profileHero .avatar{width:84px;height:84px}.counts{display:flex;gap:18px;margin-top:14px}.counts b{display:block}.sectionTitle{padding:14px;font-size:16px;font-weight:900}.friends{display:flex;gap:12px;overflow:auto;padding:0 14px 14px}.friend{min-width:72px;text-align:center;font-size:11px}.friend .avatar{width:58px;height:58px;margin:auto}.list{padding:8px 14px}.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #eef1f5}.item .grow{flex:1}.badge{background:#1765d1;color:white;border-radius:999px;padding:3px 7px;font-size:10px}.login{position:fixed;inset:0;background:linear-gradient(160deg,#0d56bd,#2b7ce1);display:flex;align-items:center;justify-content:center;padding:18px;z-index:80}.loginbox{background:white;width:min(430px,100%);border-radius:26px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.2)}.loginbox .logo{text-align:center;font-size:38px;font-weight:950;color:#145dcc}.muted{color:#718096;font-size:12px;line-height:1.6}.hidden{display:none!important}@media(min-width:681px){body{padding-bottom:0}.nav{bottom:18px;border:1px solid #e4eaf2;border-radius:20px;box-shadow:0 12px 30px rgba(20,50,90,.1)}.modal{align-items:center}.sheet{border-radius:24px;margin:auto}}
</style></head><body><div class="app"><header class="top"><div class="brand">صحبي<small>شبكة اجتماعية حديثة</small></div><button class="icon" onclick="openPanel('notifications')">🔔</button></header><main class="page" id="page"></main><nav class="nav"><button class="sel" onclick="go('home',this)"><b>⌂</b>الرئيسية</button><button onclick="go('friends',this)"><b>👥</b>الأصدقاء</button><button onclick="go('messages',this)"><b>💬</b>الرسائل</button><button onclick="go('profile',this)"><b>◉</b>حسابي</button><button onclick="openPanel('settings')"><b>⚙</b>الإعدادات</button></nav></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div><div class="login" id="login"><div class="loginbox"><div class="logo">صحبي</div><p class="muted" style="text-align:center">نسخة MVP تجريبية — Mobile First</p><div id="loginForm"><div class="field"><label>الاسم</label><input id="ln" placeholder="اسمك الكامل"></div><div class="field"><label>بريد Google / Gmail</label><input id="lgmail" type="email" placeholder="name@gmail.com"></div><div class="field"><label>اسم المستخدم</label><input id="lu" placeholder="مثال: kareem"></div><div class="field"><label>رقم الموبايل</label><input id="lp" type="tel" placeholder="01xxxxxxxxx"></div><div class="field"><label>كلمة السر</label><input id="lpass" type="password" minlength="6" placeholder="6 أحرف أو أكثر"></div><div class="field"><label>الصورة الشخصية</label><input id="lphoto" type="file" accept="image/*"></div><button class="primary" style="width:100%" onclick="requestOtp()">متابعة وإرسال OTP</button><button class="googleBtn" style="width:100%;margin-top:10px" onclick="googleDemo()">G&nbsp;&nbsp; المتابعة باستخدام Google (Gmail)</button><button id="forgotPassword" style="width:100%;margin-top:10px;background:transparent;color:#1765d1;font-weight:800" onclick="forgotPasswordDemo()">نسيت كلمة السر؟</button></div><div id="otpForm" class="hidden"><p class="muted">OTP تجريبي: <b>123456</b></p><div class="field"><label>كود التحقق</label><input id="ot
p" inputmode="numeric" maxlength="6" placeholder="123456"></div><button class="primary" style="width:100%" onclick="finishLogin()">تأكيد وإنشاء الحساب</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* صحبي V10 — Supabase integration
   ضع رابط المشروع و anon key هنا. لا تضع service_role key داخل HTML. */
const SUPABASE_URL = window.SAHBY_SUPABASE_URL || 'YOUR_SUPABASE_URL';
const SUPABASE_ANON_KEY = window.SAHBY_SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';
const SUPABASE_READY = SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_');
const sb = SUPABASE_READY ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const state={user:{name:'كريم محمد',username:'kareem',photo:'',phone:''},posts:[],friends:[['أحمد محمد','أ'],['سارة علي','س'],['محمد حسن','م'],['نور خالد','ن']],requests:[['محمود علي','م'],['ريم حسن','ر']],following:['سارة علي'],notifications:3,messages:[['أحمد محمد','أهلًا يا كريم 👋','10:31'],['سارة علي','شوفت المنشور الجديد؟','09:48']],saved:[]};
const demoMedia=['https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80','https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=900&q=80'];
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function avatar(letter,photo=''){return `<div class="avatar">${photo?`<img src="${photo}">`:letter}</div>`}
function go(page,btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('sel'));if(btn)btn.classList.add('sel');render(page)}
function render(page='home'){const p=document.getElementById('page'); if(page==='home')renderHome(p);if(page==='friends')renderFriends(p);if(page==='messages')renderMessages(p);if(page==='profile')renderProfile(p)}
function ensureDemoPosts(){if(state.posts.length===0){state.posts=[{id:1,name:'سارة علي',initial:'س',privacy:'عام',text:'صباح جميل! تجربة أول منشور في صحبي 🌤️',media:demoMedia.slice(0,3),reactions:{'❤️':12,'👍':8,'😂':2},comments:[['أحمد محمد','أ','جميل جدًا!'],['نور خالد','ن','😍']],shares:3},{id:2,name:'أحمد محمد',initial:'أ',privacy:'الأصدقاء',text:'مين جاهز للويك إند؟ 😄',media:[],reactions:{'👍':14,'😂':6},comments:[],shares:1}]}}
function renderHome(p){ensureDemoPosts();p.innerHTML=`<div class="stories">${state.friends.map((f,i)=>`<div class="story" onclick="openStory(${i})">${avatar(f[1])}<div>${f[0].split(' ')[0]}</div><small>24س</small></div>`).join('')}</div><section class="compose"><div class="row">${avatar(state.user.name[0],state.user.photo)}<textarea id="quick" placeholder="بماذا تفكر يا ${state.user.name.split(' ')[0]}؟"></textarea></div><div class="row" style="justify-content:space-between"><div class="chips"><button class="chip" onclick="openComposer()">📷 صور</button><button class="chip" onclick="openComposer(true)">🎥 فيديو</button></div><button class="primary" onclick="openComposer()">نشر</button></div></section>${state.posts.map(postHTML).join('')}`}
function samplePosts(){return postHTML({id:1,name:'سارة علي',initial:'س',privacy:'عام',text:'صباح جميل! تجربة أول منشور في صحبي 🌤️',media:demoMedia.slice(0,3),reactions:{'❤️':12,'👍':8,'😂':2},comments:[['أحمد محمد','أ', 'جميل جدًا!'],['نور خالد','ن','😍'] ]})+postHTML({id:2,name:'أحمد محمد',initial:'أ',privacy:'الأصدقاء',text:'مين جاهز للويك إند؟ 😄',media:[],reactions:{'👍':14,'😂':6},comments:[]})}
function postHTML(x){const total=Object.values(x.reactions||{}).reduce((a,b)=>a+b,0);return `<article class="post"><div class="posthead">${avatar(x.initial,x.name===state.user.name?state.user.photo:'')}<div><div class="name">${x.name}</div><div class="meta">منذ قليل</div></div><div class="privacy">${x.privacy==='عام'?'🌎':x.privacy==='الأصدقاء'?'👥':'🔒'} ${x.privacy}</div></div><div class="posttext">${x.text||''}</div>${x.media?.length?`<div class="media ${x.media.length===2?'two':x.media.length>=3?'three':''}">${x.media.map(m=>m.endsWith('.mp4')?`<video controls src="${m}"></video>`:`<img src="${m}">`).join('')}</div>`:''}<div class="stats"><span>${Object.entries(x.reactions||{}).map(([k,v])=>`${k} ${v}`).join('  ')}</span><span>${x.comments?.length||0} تعليق · ${x.shares||0} مشاركة</span></div><div class="actions"><button class="action reactionBtn" onclick="react('${x.id}','👍')" oncontextmenu="pickReact(event,${x.id})" onpointerdown="startLongPress(event,'${x.id}')" onpointerup="cancelLongPress()" onpointerleave="cancelLongPress()">👍 تفاعل</button><button class="action" onclick="openCommentsPage('${x.id}')">💬 ${x.comments?.length||0} تعليق <span style="font-size:10px">· عرض الكل</span></button><button class="action" onclick="share('${x.id}')">↗ مشاركة</button><button class="action" onclick="savePost('${x.id}')">🔖 حفظ</button></div><div class="comments" id="c${x.id}">${(x.comments||[]).map(c=>`<div class="comment">${avatar(c[1])}<div class="bubble"><b>${c[0]}</b><br>${c[2]}<div class="reply">↩ رد</div></div></div>`).join('')}<div class="row"><input id="ci${x.id}" style="flex:1;border:1px solid #dce4ef;border-radius:12px;padding:10px" placeholder="اكتب تعليقًا..."><button class="primary" onclick="comment(${x.id})">إرسال</button></div></div></article>`}
function react(id,r){let x=findPost(id);if(!x){x={id,name:'سارة علي',initial:'س',privacy:'عام',text:'صباح جميل! تجربة أول منشور في صحبي 🌤️',media:demoMedia,reactions:{},comments:[]};state.posts.push(x)}x.reactions[r]=(x.reactions[r]||0)+1;toast('تم تسجيل '+r);render('home')}
function pickReact(e,id){e.preventDefault();showReactionMenu(id,e.clientX||window.innerWidth/2,e.clientY||180);return false}
function showReactionMenu(id,x,y){let old=document.getElementById('reactionMenu');if(old)old.remove();const d=document.createElement('div');d.id='reactionMenu';d.style.cssText='position:fixed;z-index:99999;left:'+Math.max(8,Math.min(window.innerWidth-260,x-120))+'px;top:'+Math.max(70,Math.min(window.innerHeight-80,y-70))+'px;background:#fff;border:1px solid #dfe7f2;box-shadow:0 12px 35px rgba(15,45,90,.22);border-radius:18px;padding:8px;display:flex;gap:5px;direction:ltr';['👍','❤️','😂','😮','😢'].forEach(r=>{const b=document.createElement('button');b.textContent=r;b.style.cssText='width:44px;height:44px;border:0;background:#f4f7fb;border-radius:13px;font-size:22px;cursor:pointer';b.onclick=()=>{react(id,r);d.remove()};d.appendChild(b)});document.body.appendChild(d);setTimeout(()=>{document.addEventListener('click',()=>d.remove(),{once:true})},0)}
let lpTimer=null; function startLongPress(e,id){if(e.pointerType==='mouse')return;cancelLongPress();lpTimer=setTimeout(()=>showReactionMenu(id,e.clientX,e.clientY),550)} function cancelLongPress(){if(lpTimer){clearTimeout(lpTimer);lpTimer=null}}
function findPost(id){return state.posts.find(x=>x.id===id)}
function toggleComments(id){const el=document.getElementById('c'+id);if(el)el.style.display=el.style.display==='block'?'none':'block'}
function comment(id){const el=document.getElementById('ci'+id),t=el?.value.trim();if(!t)return;let x=findPost(id);if(!x){x={id,name:'سارة علي',initial:'س',privacy:'عام',text:'صباح جميل! تجربة أول منشور في صحبي 🌤️',media:demoMedia,reactions:{},comments:[]};state.posts.push(x)}x.comments.push([state.user.name,state.user.name[0],t]);el.value='';render('home');setTimeout(()=>toggleComments(id),50)}
function share(id){const x=findPost(id)||{id};x.shares=(x.shares||0)+1;toast('تمت مشاركة المنشور')}
function savePost(id){if(!state.saved.includes(id))state.saved.push(id);toast('تم حفظ المنشور')}
function openComposer(video=false){openPanel('composer',video)}
function openPanel(type,arg){const modal=document.getElementById('modal'),s=document.getElementById('sheet');modal.style.display='flex';if(type==='composer')s.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>إنشاء منشور</h2><div class="field"><label>ماذا تريد أن تنشر؟</label><textarea id="pt" rows="4" placeholder="اكتب شيئًا..."></textarea></div><div class="field"><label>الخصوصية</label><select id="pp"><option>عام</option><option>الأصدقاء</option><option>أنا فقط</option></select></div><div class="field"><label>صور متعددة + فيديو</label><input id="mediaInput" type="file" accept="image/*,video/*" multiple onchange="previewMedia(this)"><div class="preview" id="preview"></div></div><button class="primary" style="width:100%" onclick="publish()">نشر المنشور</button>`;if(type==='notifications')s.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>الإشعارات</h2><div class="list"><div class="item">❤️ <div class="grow"><b>سارة علي</b> تفاعلت مع منشورك</div><span class="badge">جديد</span></div><div class="item">👥 <div class="grow"><b>محمود علي</b> أرسل طلب صداقة</div><span class="badge">جديد</span></div><div class="item">💬 <div class="grow"><b>أحمد محمد</b> أرسل رسالة جديدة</div><span class="badge">2</span></div></div>`;if(type==='settings')s.innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>الإعدادات والخصوصية</h2><div class="item">🔒 <div class="grow"><b>خصوصية المنشورات</b><br><span class="meta">تحكم في جمهور كل منشور</span></div></div><div class="item">👁️ <div class="grow"><b>آخر ظهور</b><br><span class="meta">ظاهر للأصدقاء</span></div></div><div class="item">💬 <div class="grow"><b>من يستطيع مراسلتي</b><br><span class="meta">الأصدقاء</span></div></div><div class="item" onclick="go('profile');closeModal()">👤 <div class="grow"><b>الملف الشخصي</b><br><span class="meta">عرض وتعديل ملفك الشخصي</span></div></div><div class="item">📱 <div class="grow"><b>رقم الموبايل</b><br><span class="meta">مخفي عن الآخرين</span></div></div><div class="item logoutItem" onclick="
logout()">🚪 <div class="grow"><b>تسجيل الخروج</b><br><span class="meta">الخروج من حساب صحبي على هذا الجهاز</span></div></div>`}
function closeModal(){document.getElementById('modal').style.display='none'}
function previewMedia(inp){const box=document.getElementById('preview');box.innerHTML='';[...inp.files].slice(0,8).forEach(f=>{const u=URL.createObjectURL(f);box.innerHTML+=f.type.startsWith('video/')?`<video src="${u}" controls style="width:100%;height:100px;object-fit:cover;border-radius:10px"></video>`:`<img src="${u}">`})}
function publish(){const text=document.getElementById('pt').value.trim(),privacy=document.getElementById('pp').value,input=document.getElementById('mediaInput');let media=[];if(input?.files?.length){[...input.files].slice(0,8).forEach(f=>media.push(URL.createObjectURL(f)))}if(!text&&!media.length)return toast('أضف نصًا أو صورة أو فيديو');state.posts.unshift({id:Date.now(),name:state.user.name,initial:state.user.name[0],privacy,text,media,reactions:{},comments:[]});closeModal();render('home');toast('تم نشر المنشور')}
function renderFriends(p){p.innerHTML=`<section class="panel"><div class="sectionTitle">طلبات الصداقة</div><div class="list">${state.requests.map((r,i)=>`<div class="item">${avatar(r[1])}<div class="grow"><b>${r[0]}</b><div class="meta">يريد أن يصبح صديقك</div></div><button class="primary" onclick="acceptFriend(${i})">قبول</button></div>`).join('')}</div></section><section class="panel"><div class="sectionTitle">الأصدقاء</div><div class="friends">${state.friends.map(f=>`<div class="friend">${avatar(f[1])}<div>${f[0].split(' ')[0]}</div><div class="meta">🟢 متصل</div></div>`).join('')}</div></section><section class="panel"><div class="sectionTitle">المتابعة</div><div class="list"><div class="item">👤 <div class="grow"><b>سارة علي</b><div class="meta">تتابع هذا الحساب</div></div><button class="chip" onclick="toast('تم إلغاء المتابعة')">إلغاء</button></div></div></section>`}
function acceptFriend(i){const r=state.requests.splice(i,1)[0];state.friends.push(r);state.notifications++;toast('تم قبول طلب الصداقة');render('friends')}

async function loadSupabaseData(){
  if(!sb) return;
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(!session){document.getElementById('login').classList.remove('hidden');return;}
    const uid=session.user.id;
    const {data:profile}=await sb.from('profiles').select('id,full_name,username,avatar_url,bio').eq('id',uid).maybeSingle();
    if(profile){state.user={...state.user,name:profile.full_name||state.user.name,username:profile.username||state.user.username,photo:profile.avatar_url||'',email:session.user.email||''};}
    const {data:posts,error}=await sb.from('posts').select('id,user_id,content,image_url,created_at').order('created_at',{ascending:false}).limit(50);
    if(error) throw error;
    const ids=(posts||[]).map(p=>p.id);
    let likes=[]; let comments=[];
    if(ids.length){
      const lr=await sb.from('likes').select('id,post_id,user_id,created_at').in('post_id',ids);
      if(!lr.error) likes=lr.data||[];
      const cr=await sb.from('comments').select('id,post_id,user_id,content,created_at').in('post_id',ids).order('created_at',{ascending:true});
      if(!cr.error) comments=cr.data||[];
    }
    state.posts=(posts||[]).map(p=>{
      const rs={}; (likes.filter(l=>l.post_id===p.id)).forEach(l=>{rs['👍']=(rs['👍']||0)+1});
      const cs=comments.filter(c=>c.post_id===p.id).map(c=>[c.user_id===uid?state.user.name:'مستخدم صحبي','•',c.content]);
      return {id:p.id,name:p.user_id===uid?state.user.name:'مستخدم صحبي',initial:p.user_id===uid?state.user.name[0]:'ص',privacy:'عام',text:p.content||'',media:p.image_url?[p.image_url]:[],reactions:rs,comments:cs,shares:0};
    });
    if(state.posts.length===0) ensureDemoPosts();
    document.getElementById('login').classList.add('hidden');
    render('home');
  }catch(e){console.error(e);toast('تعذر تحميل بيانات Supabase — نكمل بالنسخة المحلية');}
}

async function supabaseSignInOrSignUp(){
  if(!sb) return false;
  const email=document.getElementById('lgmail').value.trim();
  const password=document.getElementById('lpass').value;
  const name=document.getElementById('ln').value.trim();
  const username=document.getElementById('lu').value.trim();
  const phone=document.getElementById('lp').value.trim();
  if(!email||!password)return false;
  let r=await sb.auth.signInWithPassword({email,password});
  if(r.error){
    r=await sb.auth.signUp({email,password,options:{data:{full_name:name,username,phone}}});
    if(r.error){toast(r.error.message||'فشل إنشاء الحساب');return true;}
    if(r.data.user){
      await sb.from('profiles').upsert({id:r.data.user.id,full_name:name,username,avatar_url:null,bio:''},{onConflict:'id'});
      toast(r.data.session?'تم إنشاء الحساب':'افتح Gmail لتأكيد الحساب');
    }
  }
  await loadSupabaseData();
  return true;
}

  if(sb){
